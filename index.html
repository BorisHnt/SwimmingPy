<!doctype html>
<html lang="fr">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Aller au contenu</a>

    <header class="topbar">
      <p class="eyebrow">Notebook de survie</p>
      <h1>Piscine Python</h1>
      <p data-reading>
        Des rappels courts, des exemples simples, et les pièges à revoir avant une évaluation.
      </p>
    </header>

    <aside class="sidebar" aria-label="Navigation des projets">
      <div class="sidebar-header">
        <h2>Projets</h2>
        <button id="show-all" class="plain-button" type="button">Tout afficher</button>
      </div>
      <nav id="project-nav" class="timeline" aria-label="Frise des projets"></nav>
      <a class="sidebar-shortcut" href="../SysAndNetAdmin/index.html" aria-label="Ouvrir le notebook Sys and Net Admin">
        <span class="shortcut-label">Basculer vers</span>
        <strong class="shortcut-name">Sys &amp; Net Admin</strong>
        <span class="shortcut-hint">Born2beRoot, réseau, Docker</span>
      </a>
      <a class="sidebar-shortcut" href="../PCRushes/index.html" aria-label="Ouvrir le guide PCRushes">
        <span class="shortcut-label">Guide tuteur</span>
        <strong class="shortcut-name">PCRushes</strong>
        <span class="shortcut-hint">Reviews des rushs C</span>
      </a>
    </aside>

    <main id="content" class="content" tabindex="-1">
      <section class="toolbar" aria-label="Outils de révision">
        <label class="search-label" for="search-input">Recherche</label>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          placeholder="classe, exception, fichier..."
        >
        <button id="reading-toggle" class="toggle-button" type="button" aria-pressed="false">
          Mode lecture assistée
        </button>
      </section>

      <section id="search-panel" class="search-panel" hidden>
        <div class="section-heading">
          <h2>Résultats</h2>
          <button id="clear-search" class="plain-button" type="button">Retour à la frise</button>
        </div>
        <ul id="search-results" class="result-list"></ul>
      </section>

      <section id="project-panel" class="project-panel" aria-live="polite"></section>
    </main>

    <script src="scripts/data.js"></script>
    <script src="scripts/reading-mode.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
